AWSTemplateFormatVersion: '2010-09-09'
Description: MarketingOS - console (static site on S3, API through CloudFront)

# ─────────────────────────────────────────────────────────────────────────────
#  The console is a static export: HTML, JS and CSS in a private bucket, no
#  server of its own. Every page loads its data from the browser, through
#  /api on this same domain.
#
#  One domain, two origins, chosen by path:
#
#    /api/*           the platform API Gateway (backend/template.yaml), which
#                     routes to the Python Lambda. Same origin as the pages, so
#                     the browser needs no CORS and the bundle names no domain.
#    everything else  the export in S3, through a viewer-request function:
#                       - "/campaigns" redirects to "/campaigns/", the form the
#                         export was built in;
#                       - an id in the path becomes "_": each dynamic route was
#                         exported once, for that placeholder, and the page
#                         reads the real id from the address bar;
#                       - "/x/" serves "/x/index.html".
#
#  Plain CloudFormation, deployed by buildspec.yml with
#  `aws cloudformation deploy`; the export itself is synced to the bucket after.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  DomainName:
    Type: String
    Default: ""
    Description: e.g. app.example.com. Blank uses the CloudFront domain.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN, which MUST be in us-east-1.
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 zone that owns DomainName. Set, and this stack writes the A and
      AAAA alias records itself; blank, and DNS is yours to point.
  WebAclArn:
    Type: String
    Default: ""
    Description: >-
      A web ACL of this distribution's own, from iac/edge.yaml. The CloudFront
      Free plan will not subscribe a distribution without one.

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
  HasDns: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]

Resources:

  # ── The site ────────────────────────────────────────────────────────────────
  # Same logical id and name as when it held only the build's assets, so the
  # bucket survived the move to a fully static console instead of being
  # replaced.
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'marketingos-console-static-${AWS::AccountId}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  StaticOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'marketingos-console-static-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${StaticBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${ConsoleDistribution}'
          # Without ListBucket, S3 answers a missing key with 403 rather than
          # 404, and only 404 maps to the error page (see the distribution).
          - Sid: AllowCloudFrontServicePrincipalList
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt StaticBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${ConsoleDistribution}'

  # ── Deep links onto the export ──────────────────────────────────────────────
  ConsoleUrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'marketingos-console-url-rewrite-${Environment}'
      AutoPublish: true
      FunctionConfig:
        Comment: Trailing slash, id placeholder and index.html for the console export
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var ID = /\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?=\/|$)/g;
        var FILE = /\.[a-zA-Z0-9]+$/;

        function query(qs) {
          var parts = [];
          for (var key in qs) {
            var entry = qs[key];
            var values = entry.multiValue ? entry.multiValue : [entry];
            for (var i = 0; i < values.length; i++) {
              parts.push(values[i].value === '' ? key : key + '=' + values[i].value);
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          // The export was built with trailing slashes; a page reached
          // without one would be the same HTML at a URL the app does not
          // expect, and the first render would disagree with it.
          if (!FILE.test(uri) && uri.charAt(uri.length - 1) !== '/') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: uri + '/' + query(request.querystring) } }
            };
          }
          uri = uri.replace(ID, '/_');
          if (!FILE.test(uri)) {
            uri = uri + 'index.html';
          }
          request.uri = uri;
          return request;
        }

  ConsoleDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'MarketingOS console (${Environment})'
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        # PriceClass_All, not _100: the CloudFront flat-rate plans refuse a
        # distribution restricted to fewer edge locations ("not eligible for
        # this subscription tier"), and on a flat rate the wider class costs
        # nothing extra.
        PriceClass: PriceClass_All
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref 'AWS::NoValue']
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: StaticS3Origin
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            OriginAccessControlId: !Ref StaticOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: PlatformApiOrigin
            # The API stack exports https://<id>.execute-api.<region>.amazonaws.com/<stage>:
            # the host is the origin, the stage is its path, and backend/lambda_handler.py
            # strips the stage again before FastAPI routes.
            DomainName: !Select [2, !Split ["/", { 'Fn::ImportValue': !Sub 'marketingos-api-endpoint-${Environment}' }]]
            OriginPath: !Sub
              - '/${Stage}'
              - Stage: !Select [3, !Split ["/", { 'Fn::ImportValue': !Sub 'marketingos-api-endpoint-${Environment}' }]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: StaticS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # CachingOptimized. The HTML is uploaded with no-cache, so this long
          # TTL only really applies to the content-hashed assets beside it.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ConsoleUrlRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # The API, never cached: every answer is per-account. Cookies and the
          # Authorization header travel with the rest of the viewer's headers;
          # Host does not, because API Gateway routes on its own.
          - PathPattern: /api/*
            TargetOriginId: PlatformApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        CustomErrorResponses:
          # 404 only. An error response applies to every behavior, /api/*
          # included, so mapping 403 as well would turn the API's "your role
          # cannot do that" into an HTML page.
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  ConsoleDnsA:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ConsoleDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront's own zone, for every distribution

  ConsoleDnsAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt ConsoleDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront's own zone, for every distribution

Outputs:
  ConsoleUrl:
    Description: >-
      Where the product lives. Put this in the API's CORS_ORIGINS and in the
      landing page's CONSOLE_APP_URL.
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${ConsoleDistribution.DomainName}'
  ConsoleDistributionId:
    Value: !Ref ConsoleDistribution
  ConsoleStaticBucketName:
    Description: Where buildspec.yml syncs the export.
    Value: !Ref StaticBucket

version: 0.2

# ─────────────────────────────────────────────────────────────────────────────
#  MarketingOS - console, CodeBuild spec.
#
#  A static export: `next build` writes out/, the stack in template.yaml holds
#  the bucket and the CloudFront distribution, and out/ is synced into the
#  bucket. No server, no Lambda, no container.
#
#  Deploy the backend stack first: the console stack imports its API endpoint
#  for CloudFront's /api/* origin.
# ─────────────────────────────────────────────────────────────────────────────

env:
  variables:
    CONSOLE_DOMAIN: ""
    CONSOLE_CERT_ARN: ""
    HOSTED_ZONE_ID: ""
    CONSOLE_WEB_ACL_ARN: ""
    NEXT_PUBLIC_API_URL: "/api"
    NEXT_TELEMETRY_DISABLED: "1"

phases:
  install:
    runtime-versions:
      nodejs: "22"
    commands:
      - node --version && npm --version

  pre_build:
    commands:
      - |
        for VAR in CONSOLE_STACK_NAME ENVIRONMENT NEXT_PUBLIC_API_URL; do
          if [ -z "$(eval echo \$$VAR)" ]; then
            echo "ERROR - $VAR is not set on this CodeBuild project." && exit 1
          fi
        done
      # The client calls `${NEXT_PUBLIC_API_URL}/brands`, so a URL that does
      # not end in /api produces a bundle whose every request 404s.
      - |
        case "$NEXT_PUBLIC_API_URL" in
          */api) : ;;
          *) echo "ERROR - NEXT_PUBLIC_API_URL must end with /api." && exit 1 ;;
        esac
      - cd $CODEBUILD_SRC_DIR/frontend
      - npm ci
      # Typecheck and lint before the build: a type error should fail in
      # thirty seconds, not after `next build`.
      - npx tsc --noEmit
      - npm run lint
      - npm test

  build:
    commands:
      - cd $CODEBUILD_SRC_DIR/frontend
      # A restored .next can carry a previous NEXT_PUBLIC_* into the bundle.
      - rm -rf .next out
      - NEXT_PUBLIC_AUTH_REQUIRED=true npm run build
      - test -f out/index.html || (echo "ERROR - the export produced no index.html" && exit 1)
      - |
        aws cloudformation deploy \
          --template-file template.yaml \
          --stack-name "${CONSOLE_STACK_NAME}" \
          --no-fail-on-empty-changeset \
          --parameter-overrides \
            "Environment=${ENVIRONMENT}" \
            "DomainName=${CONSOLE_DOMAIN}" \
            "CertificateArn=${CONSOLE_CERT_ARN}" \
            "HostedZoneId=${HOSTED_ZONE_ID}" \
            "WebAclArn=${CONSOLE_WEB_ACL_ARN}"

  post_build:
    commands:
      # CodeBuild runs post_build even after a failed build phase.
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1" || exit 1
      - cd $CODEBUILD_SRC_DIR/frontend
      - |
        BUCKET=$(aws cloudformation describe-stacks --stack-name "${CONSOLE_STACK_NAME}" \
          --query "Stacks[0].Outputs[?OutputKey=='ConsoleStaticBucketName'].OutputValue" --output text)
        DIST=$(aws cloudformation describe-stacks --stack-name "${CONSOLE_STACK_NAME}" \
          --query "Stacks[0].Outputs[?OutputKey=='ConsoleDistributionId'].OutputValue" --output text)
        # Content-hashed assets first, cached for a year and never deleted: a
        # tab opened before this deploy still asks for the previous chunks.
        aws s3 sync out/ "s3://${BUCKET}/" --only-show-errors \
          --cache-control "public,max-age=31536000,immutable" \
          --exclude "*.html" --exclude "*.txt" --exclude "*.json"
        # Then the pages and their RSC payloads, revalidated on every request
        # so a deploy is live at once. --delete only reaches these.
        aws s3 sync out/ "s3://${BUCKET}/" --only-show-errors --delete \
          --cache-control "public,no-cache,must-revalidate" \
          --exclude "*" --include "*.html" --include "*.txt" --include "*.json"
        aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" >/dev/null
      - |
        aws cloudformation describe-stacks --stack-name "${CONSOLE_STACK_NAME}" \
          --query "Stacks[0].Outputs" --output table
      - echo "Console deployed."

cache:
  paths:
    - frontend/node_modules/**/*

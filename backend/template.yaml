AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MarketingOS - platform API (Lambda + HTTP API Gateway)

# ─────────────────────────────────────────────────────────────────────────────
#  What this stack is, and what it is not.
#
#  It serves authenticated reads and CRUD. The console now reads snapshots
#  over HTTP on manual refresh; it does not open SSE connections.
#
#  Email campaigns run in Standard Step Functions: Plan, one Craft per email,
#  then Finish. Market and knowledge jobs run in a separate async Lambda.
#  Durable database admission and recovery protect against duplicate delivery.
#  Job functions read metered API credentials from SSM at invocation time.
#  LinkedIn tools use the background Lambda; campaign-channel LinkedIn is separate.
#
#  Secrets are CloudFormation parameters with NoEcho, fed from CodeBuild
#  environment variables through envsubst (see samconfig.yaml). Nothing secret
#  is committed to this repository.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: >-
      CloudWatch retention for every log group in this stack. Logs are a
      running cost with no ceiling unless one is set.

  # ── Database ───────────────────────────────────────────────────────────────
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: >-
      SQLAlchemy URL, e.g. postgresql+psycopg://user:pass@host:5432/marketingos.
      Not SQLite: a Lambda filesystem is neither shared between containers nor
      durable across them.

  # ── Auth ───────────────────────────────────────────────────────────────────
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Signs platform access tokens. 32+ random bytes, hex encoded.
  PasswordPepper:
    Type: String
    NoEcho: true
    Description: >-
      Folded into every password hash. Changing it invalidates every existing
      password in the database - treat it as permanent once there are users.
  AuthRequired:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Ignored when ENVIRONMENT is production - the application forces it on
      there. Here so a staging stack can be opened up deliberately.
  AllowPublicSignup:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Off by default. Every run spends model quota, so an open signup form is
      a bill rather than a funnel until there is metering behind it.
  AccessTokenTtlMinutes:
    Type: Number
    Default: 60
  RefreshTokenTtlDays:
    Type: Number
    Default: 30

  # ── Application ────────────────────────────────────────────────────────────
  CorsOrigins:
    Type: String
    Default: "http://localhost:3000"
    Description: Comma-separated origins allowed to call this API.
  AppEnv:
    Type: String
    Default: production
    AllowedValues: [development, production, test]
    Description: >-
      Drives app.core.config. "production" forces AUTH_REQUIRED on and refuses
      to start while the signing secrets are still the development values.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

  JobMemorySize:
    Type: Number
    Default: 2048
    MinValue: 512
    MaxValue: 10240
    Description: >-
      The campaign steps hold the whole evidence ledger and several drafts in
      memory while they work, and Lambda scales CPU with memory - a step that
      spends four minutes waiting on a model should not also spend thirty
      seconds parsing its own prompts.

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Billed per token. The deliberate opposite of the CLI path, where
      `_clean_env()` strips the key so a run bills the operator's subscription
      instead - here there is no CLI, no $HOME to authenticate and no browser
      for an OAuth flow, so a key is the only way a Lambda can call a model at
      all. Empty leaves the campaign workflow unable to run.

  OpenAiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: The same, for the GPT half of the catalog.

  # ── Networking ─────────────────────────────────────────────────────────────
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Private subnets that can reach RDS. Leave blank only if the database is
      publicly reachable, which it should not be.
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Security groups for the function; must be allowed into the RDS group.

  # ── Sizing ─────────────────────────────────────────────────────────────────
  ApiMemorySize:
    Type: Number
    Default: 1024
    MinValue: 512
    MaxValue: 3008
    Description: >-
      Lambda gives CPU in proportion to memory, and this function imports a
      large dependency tree at cold start. Below 512 MB the import itself is
      what users experience as latency.
  ApiTimeout:
    Type: Number
    Default: 30
    Description: >-
      API Gateway's own hard limit is 30s, so a longer function timeout only
      buys an invocation nobody is still waiting for.

Conditions:
  HasVpcConfig: !Not [!Equals [!Join ["", !Ref VpcSubnetIds], ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]  # Cheaper per GB-second than x86_64, same code.
    Tracing: Active
    Environment:
      Variables:
        APP_ENV: !Ref AppEnv
        LOG_LEVEL: !Ref LogLevel
        DATABASE_URL: !Ref DatabaseUrl
        JWT_SECRET: !Ref JwtSecret
        PASSWORD_PEPPER: !Ref PasswordPepper
        AUTH_REQUIRED: !Ref AuthRequired
        ALLOW_PUBLIC_SIGNUP: !Ref AllowPublicSignup
        ACCESS_TOKEN_TTL_MINUTES: !Ref AccessTokenTtlMinutes
        REFRESH_TOKEN_TTL_DAYS: !Ref RefreshTokenTtlDays
        CORS_ORIGINS: !Ref CorsOrigins
        # The HTTP API's stage, which API Gateway leaves at the front of every
        # path. lambda_handler.py strips it before FastAPI routes.
        API_GATEWAY_BASE_PATH: !Sub '/${Environment}'
        # No ANTHROPIC_API_KEY, and that is load-bearing rather than an
        # oversight: both providers bill a subscription through their CLI, and
        # a visible API key makes the CLI switch to API-key billing and charge
        # a card. See app.ai.claude_provider._clean_env.

Resources:

  # ── HTTP API ────────────────────────────────────────────────────────────────
  # HTTP API rather than REST API: cheaper per request, lower latency, and this
  # stack needs none of what REST adds (request validation, usage plans) -
  # authorisation is a bearer token the application verifies itself.
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        # Permissive at the edge, enforced in the app from CORS_ORIGINS. Doing
        # it in one place means the allowlist changes without a stack update.
        AllowOrigins: ["*"]
        AllowHeaders: ["Content-Type", "Authorization", "Accept", "Origin"]
        AllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'marketingos-api-${Environment}'
      Description: MarketingOS platform API
      CodeUri: ./
      Handler: lambda_handler.handler
      Environment:
        Variables:
          # The Lambda bundle excludes the subscription CLI. CRUD constructs
          # providers but never calls them; JOB_HOST stays unset and no vendor
          # keys are supplied to this HTTP function.
          AI_BILLING: api
          CAMPAIGN_WORKFLOW_ARN: !Ref CampaignWorkflow
          BACKGROUND_FUNCTION_NAME: !Ref BackgroundFunction
      MemorySize: !Ref ApiMemorySize
      Timeout: !Ref ApiTimeout
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - LambdaInvokePolicy:
            FunctionName: !Sub 'marketingos-background-${Environment}'
        - Statement:
            Effect: Allow
            Action: states:StartExecution
            Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:marketingos-campaign-${Environment}'
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /
            Method: ANY

  # Declared rather than left to Lambda's implicit creation, which makes an
  # unbounded group that keeps every line forever.
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/marketingos-api-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  # ── Migrations ──────────────────────────────────────────────────────────────
  # `alembic upgrade head` as its own function, invoked by hand after a deploy.
  # Deliberately not run on the API's cold start: concurrent containers would
  # race each other through the same migrations, and a schema change would land
  # whenever traffic happened to arrive rather than when somebody decided.
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'marketingos-migrate-${Environment}'
      Description: Runs `alembic upgrade head`. Invoke manually after deploying.
      CodeUri: ./
      Handler: migrate.handler
      ReservedConcurrentExecutions: 1
      MemorySize: 512
      Timeout: 300
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole

  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/marketingos-migrate-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  # -- Campaign execution: three functions and a state machine -----------------
  #
  #  A campaign cannot run in one Lambda. `balanced` budgets itself 1200
  #  seconds and `maximum` 2400, and Lambda stops at 900 - not a setting, a
  #  ceiling. But one email is 10 to 35 model calls, roughly four minutes, so
  #  the work fits once the unit is an email rather than a campaign.
  #
  #  Hence: plan once, craft N times, finish once, with Step Functions owning
  #  the loop. Nothing but an execution id travels between the states; the run
  #  itself lives in `campaignrunstate` and the artifacts in their own tables,
  #  which is what keeps the payload far under the 256 KB state limit.
  #
  #  These three set JOB_HOST, which is what lets `work_limits` admit model
  #  work on Lambda at all. The API function deliberately does not: it answers
  #  a button press behind a 30-second gateway timeout, and accepting a whole
  #  campaign there is how a run gets truncated with nothing recording where
  #  it stopped.

  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'marketingos-plan-${Environment}'
      Description: Compiles knowledge and decides the campaign. One Strategist call.
      CodeUri: ./
      Handler: step_handlers.plan
      MemorySize: !Ref JobMemorySize
      Timeout: 900
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          JOB_HOST: "true"
          MODEL_TIMEOUT_SECONDS: "180"
          AI_BILLING: api
          MODEL_KEYS_SSM_PREFIX: !Sub "/marketingos/${Environment}"
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            Effect: Allow
            Action: ssm:GetParameter
            Resource:
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/anthropic-api-key'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/openai-api-key'

  CraftFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'marketingos-craft-${Environment}'
      Description: Writes one email. Invoked once per email by the state machine.
      CodeUri: ./
      Handler: step_handlers.craft
      MemorySize: !Ref JobMemorySize
      Timeout: 900
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          JOB_HOST: "true"
          MODEL_TIMEOUT_SECONDS: "180"
          AI_BILLING: api
          MODEL_KEYS_SSM_PREFIX: !Sub "/marketingos/${Environment}"
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            Effect: Allow
            Action: ssm:GetParameter
            Resource:
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/anthropic-api-key'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/openai-api-key'

  FinishFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'marketingos-finish-${Environment}'
      Description: Sequence pass, report, deliverables.
      CodeUri: ./
      Handler: step_handlers.finish
      MemorySize: !Ref JobMemorySize
      Timeout: 900
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          JOB_HOST: "true"
          MODEL_TIMEOUT_SECONDS: "180"
          AI_BILLING: api
          MODEL_KEYS_SSM_PREFIX: !Sub "/marketingos/${Environment}"
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            Effect: Allow
            Action: ssm:GetParameter
            Resource:
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/anthropic-api-key'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/openai-api-key'

  PlanLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/marketingos-plan-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  CraftLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/marketingos-craft-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  FinishLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/marketingos-finish-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  CampaignWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'marketingos-campaign-${Environment}'
      Type: STANDARD
      DefinitionUri: campaign.asl.json
      DefinitionSubstitutions:
        PlanArn: !GetAtt PlanFunction.Arn
        CraftArn: !GetAtt CraftFunction.Arn
        FinishArn: !GetAtt FinishFunction.Arn
        RecoveryArn: !GetAtt RecoveryFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PlanFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CraftFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FinishFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RecoveryFunction

  # ── Alarms ──────────────────────────────────────────────────────────────────
  # Two alarms, no dashboard. With no users yet the question worth answering is
  # "is it broken", not "how is it trending", and an alarm nobody has wired to
  # a notification is still visible in the console.
  RecoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'marketingos-recover-${Environment}'
      CodeUri: ./
      Handler: step_handlers.recover
      Timeout: 120
      Environment:
        Variables:
          AI_BILLING: api
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Events:
        WorkflowFailure:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.states]
              detail-type: [Step Functions Execution Status Change]
              detail:
                stateMachineArn: [!Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:marketingos-campaign-${Environment}']
                status: [FAILED, TIMED_OUT, ABORTED]

  ReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'marketingos-reconcile-${Environment}'
      CodeUri: ./
      Handler: step_handlers.reconcile
      Timeout: 120
      Environment:
        Variables:
          AI_BILLING: api
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            Effect: Allow
            Action: states:DescribeExecution
            Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:marketingos-campaign-${Environment}:*'
      Events:
        Reconcile:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)

  ProviderProbeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'marketingos-probe-${Environment}'
      CodeUri: ./
      Handler: step_handlers.probe
      Timeout: 60
      Environment:
        Variables:
          AI_BILLING: api
          MODEL_KEYS_SSM_PREFIX: !Sub "/marketingos/${Environment}"
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            Effect: Allow
            Action: ssm:GetParameter
            Resource:
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/anthropic-api-key'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/openai-api-key'

  BackgroundFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'marketingos-background-${Environment}'
      CodeUri: ./
      Handler: step_handlers.background
      Timeout: 900
      MemorySize: !Ref JobMemorySize
      Environment:
        Variables:
          AI_BILLING: api
          JOB_HOST: "true"
          MODEL_TIMEOUT_SECONDS: "180"
          MODEL_KEYS_SSM_PREFIX: !Sub "/marketingos/${Environment}"
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 120
        DestinationConfig:
          OnFailure:
            Type: Lambda
            Destination: !GetAtt RecoveryFunction.Arn
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            Effect: Allow
            Action: ssm:GetParameter
            Resource:
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/anthropic-api-key'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/marketingos/${Environment}/openai-api-key'

  RecoveryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/marketingos-recover-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  ReconcileLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/marketingos-reconcile-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  ProviderProbeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/marketingos-probe-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  BackgroundLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/marketingos-background-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'marketingos-api-errors-${Environment}'
      AlarmDescription: The API function is throwing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApiThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'marketingos-api-throttles-${Environment}'
      AlarmDescription: Requests are being throttled - concurrency is too low.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: >-
      Base URL of the API. The frontend's NEXT_PUBLIC_API_URL is this plus /api.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub 'marketingos-api-endpoint-${Environment}'
  ApiFunctionArn:
    Value: !GetAtt ApiFunction.Arn
  MigrateFunctionName:
    Description: Invoke this after every deploy that carries a migration.
    Value: !Ref MigrateFunction
  CampaignWorkflowArn:
    Description: >-
      The campaign state machine. Start a run against an existing execution row
      with an input of {"execution_id": "<uuid>"}.
    Value: !Ref CampaignWorkflow

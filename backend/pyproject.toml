[project]
name = "marketingos-backend"
version = "0.1.0"
description = "MarketingOS - AI-powered multi-agent marketing platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Accounts: bcrypt directly rather than through passlib, whose bcrypt
    # backend breaks against bcrypt 4.x, and PyJWT rather than python-jose,
    # which is unmaintained.
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    # Lets the same ASGI app answer an API Gateway event without a change.
    "mangum>=0.19.0",
    "claude-agent-sdk>=0.2.128",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "langdetect>=1.0.9",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

AWSTemplateFormatVersion: '2010-09-09'
Description: MarketingOS - Aurora Serverless v2 Postgres, and the network the Lambdas reach it through

# ─────────────────────────────────────────────────────────────────────────────
#  Deployed once, by hand, before anything else. Everything after it consumes
#  its outputs.
#
#      aws cloudformation deploy \
#        --template-file iac/database.yaml \
#        --stack-name marketingos-data-prod \
#        --parameter-overrides Environment=prod \
#        --capabilities CAPABILITY_IAM
#
#  The master password is read from /marketingos/<env>/db-password, which
#  iac/parameters.sh creates - it never passes through a shell.
#
#  The shape is deliberately the smallest thing that is not wrong:
#
#  - The database is **not** publicly reachable. Reaching it from a laptop
#    means a bastion or SSM port forwarding; the migration Lambda in the
#    backend stack exists so that routine schema changes do not need either.
#  - The Lambdas sit in private subnets with **no NAT Gateway**. A NAT is about
#    $32/month before a byte moves, and nothing in the API calls the open
#    internet - `app/market` does, and market work runs on the worker, not on
#    Lambda. Add one here if that changes.
#  - Two AZs because RDS demands a subnet group spanning two, not because this
#    is highly available. It is a single writer and no reader.
#  - Aurora Serverless v2 rather than an RDS instance, with a minimum of zero
#    capacity: after AutoPauseSeconds without a connection it pauses and bills
#    storage only, and the first connection after that resumes it in about
#    fifteen seconds. A db.t4g.micro instance bills ~$15 a month whether or
#    not anybody signed in; this bills for the minutes somebody did. The
#    Lambdas open a connection per request (app/core/database.py) precisely
#    so that a frozen container's pooled connection cannot hold it awake.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  DBName:
    Type: String
    Default: marketingos
  DBUsername:
    Type: String
    Default: marketingos
  MaxCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 16
    Description: >-
      Aurora capacity units at most (1 ACU is about 2 GB of memory). The cap is
      also the ceiling on what an hour of the database can cost.
  AutoPauseSeconds:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
    Description: >-
      Idle seconds before the database pauses to zero capacity. Shorter pauses
      sooner and bills less; every resume costs the next request ~15 seconds.
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: Automated backups. 0 disables them, which is never the answer.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'marketingos-${Environment}'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub 'marketingos-private-a-${Environment}'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub 'marketingos-private-b-${Environment}'

  # Lambdas live here. It has no inbound rules at all - nothing dials into a
  # function - and its only purpose is to be the thing the database's rule
  # names, so "who may reach the database" is a group membership rather than a
  # CIDR somebody has to keep accurate.
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MarketingOS Lambda functions
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound to the database (there is no NAT, so this goes nowhere else)

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MarketingOS Postgres
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Postgres from the Lambdas, and from nothing else

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: MarketingOS private subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  # Snapshot rather than Delete: `cloudformation delete-stack` on the wrong
  # environment should cost an afternoon, not the customers.
  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub 'marketingos-${Environment}'
      Engine: aurora-postgresql
      # 16.3 is the first 16.x that can scale to zero.
      EngineVersion: "16.15"
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBUsername
      # A SecureString, resolved by CloudFormation at deploy time and never
      # stored in the template or the stack's parameters.
      MasterUserPassword: !Sub '{{resolve:ssm-secure:/marketingos/${Environment}/db-password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref BackupRetentionDays
      PreferredBackupWindow: "03:00-04:00"
      PreferredMaintenanceWindow: "sun:04:00-sun:05:00"
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: !Ref MaxCapacity
        SecondsUntilAutoPause: !Ref AutoPauseSeconds

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub 'marketingos-${Environment}-writer'
      DBClusterIdentifier: !Ref DatabaseCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true

Outputs:
  DatabaseUrl:
    Description: >-
      DATABASE_URL for every stack that talks to Postgres. Store it in Secrets
      Manager and reference it from CodeBuild - do not paste it into a file.
    Value: !Sub
      - 'postgresql+psycopg://${DBUsername}:PASSWORD@${Endpoint}:${Port}/${DBName}'
      - Endpoint: !GetAtt DatabaseCluster.Endpoint.Address
        Port: !GetAtt DatabaseCluster.Endpoint.Port
  DatabaseEndpoint:
    Value: !GetAtt DatabaseCluster.Endpoint.Address
  VpcSubnetIds:
    Description: VPC_SUBNET_IDS for the backend and back-office buildspecs.
    Value: !Sub '${PrivateSubnetA},${PrivateSubnetB}'
  VpcSecurityGroups:
    Description: VPC_SECURITY_GROUPS for the backend and back-office buildspecs.
    Value: !Ref LambdaSecurityGroup
  VpcId:
    Description: >-
      For iac/worker.yaml, which adds public subnets and an internet gateway to
      this VPC. Nothing else needs it: the Lambda stacks are told their subnets
      and groups directly.
    Value: !Ref Vpc
    Export:
      Name: !Sub 'marketingos-vpc-id-${Environment}'
  DatabaseSecurityGroupId:
    Description: >-
      For iac/worker.yaml, which adds one ingress rule to it rather than making
      this template aware of a stack that may never be deployed.
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub 'marketingos-db-sg-${Environment}'

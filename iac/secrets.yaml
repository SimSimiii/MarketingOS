AWSTemplateFormatVersion: '2010-09-09'
Description: MarketingOS - the secrets every other stack reads

# ─────────────────────────────────────────────────────────────────────────────
#  Deployed second, after nothing and before everything.
#
#      aws cloudformation deploy \
#        --template-file iac/secrets.yaml \
#        --stack-name marketingos-secrets-prod \
#        --parameter-overrides Environment=prod
#
#  CloudFormation generates five of the values, which is the point (the two
#  vendor API keys and DATABASE_URL cannot be generated; see below). `GenerateSecretString`
#  runs **once, at create time**, and is never re-evaluated on a stack update -
#  so an `aws cloudformation deploy` against this stack cannot silently mint a
#  new PASSWORD_PEPPER and invalidate every password in the database. That is
#  the one failure mode worth designing the whole file around; see the comment
#  on PasswordPepper.
#
#  Nothing here is ever passed to a CodeBuild project as a plaintext value. The
#  projects in pipeline.yaml reference these ARNs through CodeBuild's
#  `SECRETS_MANAGER` environment type, so the value is resolved by the build
#  agent at run time and never appears in a template, a console field, or this
#  repository.
#
#  Cost: Secrets Manager is $0.40 per secret per month. Eight secrets is $3.20/month.
#  Parameter Store SecureString would be free, and is the right trade the day
#  this needs to be cheaper than it is legible.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:

  # ── Database password ───────────────────────────────────────────────────────
  # RDS rejects '/', '@', '"' and spaces in a master password, and a
  # URL-encoding surprise inside DATABASE_URL is a bad way to discover that.
  # ExcludePunctuation is a superset of those four - it leaves only letters and
  # digits - so the generated value is always URL-safe by construction rather
  # than by a reviewer noticing. 32 alphanumerics is ~190 bits.
  DbPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'marketingos/${Environment}/db-password'
      Description: RDS master password. Consumed by database.yaml as a dynamic reference.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  # ── Platform signing secrets ────────────────────────────────────────────────
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'marketingos/${Environment}/jwt-secret'
      Description: >-
        Signs platform access tokens. Rotating it signs everybody out and
        nothing worse - this is the recoverable one.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  PasswordPepper:
    Type: AWS::SecretsManager::Secret
    # Retain on both, and that is not boilerplate. This value is folded into
    # every bcrypt hash in the database: if the secret is deleted or replaced,
    # every password ever set stops verifying and there is no migration back,
    # because the hashes are one-way. A stack delete must leave this behind.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'marketingos/${Environment}/password-pepper'
      Description: >-
        PERMANENT. Folded into every password hash. Rotating it invalidates
        every password in the database. Never replace this secret.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ── Back-office signing secrets ─────────────────────────────────────────────
  # Separate secrets rather than separate keys in one secret: the back-office
  # CodeBuild project should be able to read its own two and not the platform's.
  # One secret holding all four would make that an all-or-nothing grant, and the
  # whole reason AdminJwtSecret exists is that the two systems do not trust each
  # other. administration/backend/buildspec.yml fails the build if they match.
  AdminJwtSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'marketingos/${Environment}/admin-jwt-secret'
      Description: >-
        Signs operator tokens. Generated independently of JwtSecret, so the two
        cannot collide.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  AdminPwdPepper:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'marketingos/${Environment}/admin-pwd-pepper'
      Description: >-
        PERMANENT, for the same reason as PasswordPepper. It must be the value
        scripts/bootstrap_admin.py ran with, or no operator can sign in.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ── Vendor API keys ─────────────────────────────────────────────────────────
  # Written by hand, because only the vendor can mint them. Unlike everything
  # above, these are not generated: CloudFormation cannot create an Anthropic
  # or an OpenAI key.
  #
  #   aws secretsmanager put-secret-value \
  #     --secret-id marketingos/<env>/anthropic-api-key --secret-string "sk-ant-..."
  #
  # They exist here at all because a Lambda cannot bill a subscription. The
  # CLIs authenticate through an interactive OAuth flow against a `$HOME` that
  # a function does not have, so the campaign state machine pays per token -
  # and these keys are what it pays with. Treat the blast radius accordingly:
  # a leaked key is a metered bill, not a signed-out user.
  AnthropicApiKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'marketingos/${Environment}/anthropic-api-key'
      Description: Per-token billing for the campaign state machine. Set by hand.
      SecretString: "set-me-from-the-anthropic-console"

  OpenAiApiKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'marketingos/${Environment}/openai-api-key'
      Description: The same, for the GPT half of the catalog. Set by hand.
      SecretString: "set-me-from-the-openai-console"

  # ── DATABASE_URL ────────────────────────────────────────────────────────────
  # Written by hand after database.yaml reports its endpoint, because the URL
  # cannot exist before the instance does. Created empty here so the ARN is
  # stable and pipeline.yaml can reference it before it has a value.
  #
  #   aws secretsmanager put-secret-value \
  #     --secret-id marketingos/prod/database-url \
  #     --secret-string "postgresql+psycopg://marketingos:<pw>@<endpoint>:5432/marketingos"
  DatabaseUrl:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'marketingos/${Environment}/database-url'
      Description: >-
        Full SQLAlchemy URL. Set by hand once RDS exists - see the runbook in
        iac/README.md. Not SQLite: a Lambda filesystem is neither shared
        between containers nor durable across them.
      SecretString: "postgresql+psycopg://set-me-after-the-database-stack"

Outputs:
  DbPasswordArn:
    Description: Pass to database.yaml as a {{resolve:secretsmanager:...}} reference.
    Value: !Ref DbPassword
    Export:
      Name: !Sub 'marketingos-secret-db-password-${Environment}'
  JwtSecretArn:
    Value: !Ref JwtSecret
    Export:
      Name: !Sub 'marketingos-secret-jwt-${Environment}'
  PasswordPepperArn:
    Value: !Ref PasswordPepper
    Export:
      Name: !Sub 'marketingos-secret-pepper-${Environment}'
  AdminJwtSecretArn:
    Value: !Ref AdminJwtSecret
    Export:
      Name: !Sub 'marketingos-secret-admin-jwt-${Environment}'
  AdminPwdPepperArn:
    Value: !Ref AdminPwdPepper
    Export:
      Name: !Sub 'marketingos-secret-admin-pepper-${Environment}'
  DatabaseUrlArn:
    Value: !Ref DatabaseUrl
    Export:
      Name: !Sub 'marketingos-secret-database-url-${Environment}'

  AnthropicApiKeyArn:
    Value: !Ref AnthropicApiKey
    Export:
      Name: !Sub 'marketingos-secret-anthropic-key-${Environment}'
  OpenAiApiKeyArn:
    Value: !Ref OpenAiApiKey
    Export:
      Name: !Sub 'marketingos-secret-openai-key-${Environment}'

# Deliberately NOT an output: the dynamic-reference string that database.yaml
# wants for DBPassword. CloudFormation resolves `{{resolve:secretsmanager:...}}`
# everywhere it appears in a template - Outputs included - so publishing it
# here would print the generated password in plaintext to anyone with
# `describe-stacks`. The literal to paste is in iac/README.md instead, where it
# is text rather than something CloudFormation evaluates.

